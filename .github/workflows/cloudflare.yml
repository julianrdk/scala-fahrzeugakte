name: Prüfen und gemeinsam auf Cloudflare veröffentlichen
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/configure.mjs --ci
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      - run: pnpm check
      - run: pnpm test:runtime
      - run: pnpm test:large
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: service-${{ github.sha }}
          path: auth/dist/service.js
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.FLEET_RELEASE_READY == 'true'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: website-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: service-${{ github.sha }}
          path: auth/dist
      - run: node scripts/configure.mjs --ci && node scripts/validate-release.mjs && node scripts/prepare-deploy.mjs
        env:
          PAGES_DOMAIN: ${{ vars.PAGES_DOMAIN }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
      - name: Geprüften Worker veröffentlichen
        run: pnpm exec wrangler deploy --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
      - name: Geprüfte Website veröffentlichen
        run: pnpm exec wrangler pages deploy dist --project-name scala-fahrzeugakte --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
