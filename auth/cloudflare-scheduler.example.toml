name = "fahrzeugakte-tagespruefung"
main = "./scheduler.js"
compatibility_date = "2026-10-27"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DATA_DB"
database_name = "fahrzeugakte-daten"
database_id = "NEUE_D1_DATENBANK_ID_EINTRAGEN"

[[r2_buckets]]
binding = "FILES"
bucket_name = "fahrzeugakte-originale"

[vars]
AUTH_BACKEND = "clerk"
APP_ORIGIN = "https://car.jurodak.com"
AUTH_ORIGIN = "https://auth.jurodak.com"
CLERK_PUBLISHABLE_KEY = "pk_live_BEI_CLERK_ABLESEN"
CLERK_ISSUER = "https://CLERK_FRONTEND_API_EINTRAGEN"
GOOGLE_AUTOMATION_STOPPED = "false"
MAIL_FROM = "Fahrzeugakte <hinweise@notify.jurodak.com>"
# CLERK_SECRET_KEY, CLERK_JWT_KEY und RESEND_API_KEY als Secrets hinterlegen.
